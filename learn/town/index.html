<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd23f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mellis">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Aprenem: el meu poble · Laboratorio Mellis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏘️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="../animals/animals.css">
  <link rel="stylesheet" href="town.css">
</head>
<body class="town-bg">
  <header class="topbar">
    <a class="home" href="../../index.html" aria-label="home">🏠</a>
    <h1 class="title" id="title"></h1>
    <div id="controls"></div>
  </header>

  <div class="lesson-bar" id="lesson-bar" hidden>
    <div id="hearts"></div>
    <div class="lesson-steps" id="lesson-steps"></div>
  </div>

  <!-- Unit: the lessons + the town map (album) -->
  <main id="unit" class="screen unit">
    <div class="unit-head"><div id="mascots" class="unit-mascots"></div><h2 id="unit-title"></h2></div>
    <div class="lessons" id="lessons"></div>
    <button class="go-btn album-btn stick-bottom" id="album-btn">🗺️ <span id="album-label"></span> <b id="album-count"></b></button>
  </main>

  <!-- Explore: the map (places) or the workers (jobs) -->
  <main id="explore" class="screen" hidden>
    <div class="say-row"><p class="task" id="explore-intro"></p><button class="round-btn" id="say-explore">🔊</button></div>
    <p class="fact" id="explore-fact" hidden></p>
    <div class="town" id="explore-map"></div>
    <div class="groups jobs" id="groups" hidden></div>
    <button class="go-btn stick-bottom" id="explore-next" hidden>➡️</button>
  </main>

  <!-- Walk: tap the place, someone walks there -->
  <main id="walk" class="screen" hidden>
    <div class="choose-progress" id="walk-progress"></div>
    <div class="say-row"><p class="task" id="walk-ask"></p><button class="round-btn" id="say-walk">🔊</button></div>
    <div class="a-stage">
      <div class="town" id="walk-map"></div>
      <p class="fact over" id="walk-msg" hidden></p>
    </div>
  </main>

  <!-- Tool: what does each worker use? -->
  <main id="tool" class="screen" hidden>
    <div class="choose-progress" id="tool-progress"></div>
    <div class="say-row"><p class="task" id="tool-ask"></p><button class="round-btn" id="say-tool">🔊</button></div>
    <div class="a-stage">
      <div class="choose-item" id="tool-who"></div>
      <p class="fact over" id="tool-msg" hidden></p>
    </div>
    <div class="odds three" id="tool-opts"></div>
  </main>

  <!-- Check -->
  <main id="check" class="screen" hidden>
    <div class="say-row"><p class="task" id="check-ask"></p><button class="round-btn" id="say-check">🔊</button></div>
    <div class="odds" id="check-opts"></div>
    <p class="fact" id="check-msg" hidden></p>
  </main>

  <!-- Album: the town colours in -->
  <main id="album" class="screen" hidden>
    <h2 class="album-title" id="album-title"></h2>
    <div class="town album-town" id="album-map"></div>
    <button class="go-btn stick-bottom" id="album-back">👍</button>
  </main>

  <div id="win" class="win" hidden>
    <div class="win-box">
      <div class="win-twins" id="win-twins"></div>
      <p class="win-text" id="win-text"></p>
      <div id="win-stars"></div>
      <p class="win-new" id="win-new"></p>
      <div class="win-cards" id="win-cards"></div>
      <div class="win-buttons">
        <button class="big-btn" id="again" style="background:var(--orange)">🔁</button>
        <button class="big-btn" id="to-album" style="background:var(--teal)">🗺️</button>
        <button class="big-btn" id="to-unit" style="background:var(--yellow)">🎒</button>
      </div>
    </div>
  </div>

  <script src="../../shared/app.js"></script>
  <script src="town-data.js"></script>
  <script src="town.js"></script>
</body>
</html>
