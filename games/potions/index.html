<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9f5">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mellis">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Potion Lab · Laboratorio Mellis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="potions.css">
</head>
<body class="hut">
  <div class="jars" aria-hidden="true">🫙 🧪 🍄 🕯️ 🫙 🌿 ⚗️ 🧪 🦴 🫙 🕯️ 🍄</div>
  <header class="topbar">
    <a class="home" href="../../index.html" aria-label="home">🏠</a>
    <h1 class="title" id="title"></h1>
    <div id="controls"></div>
  </header>

  <!-- Level picker -->
  <main id="levels" class="levels">
    <div class="levels-head">
      <div class="xiruca big" id="xiruca-levels"></div>
      <div class="levels-tools">
        <button class="round-btn" id="music-levels"></button>
      </div>
    </div>
    <p class="levels-ask" id="ask"></p>
    <div class="level-grid">
      <button class="level" data-level="1" style="background:var(--teal)">
        <span class="level-name" id="l1-name"></span>
        <span class="level-sub">7 + 5 · 15 − 3</span>
      </button>
      <button class="level" data-level="2" style="background:var(--orange)">
        <span class="level-name" id="l2-name"></span>
        <span class="level-sub">34 + 5 · 70 − 20</span>
      </button>
      <button class="level" data-level="3" style="background:var(--purple)">
        <span class="level-name" id="l3-name"></span>
        <span class="level-sub">38 + 7 · 52 − 9</span>
      </button>
      <button class="level" data-level="4" style="background:#3a86ff">
        <span class="level-name" id="l4-name"></span>
        <span class="level-sub">🔍 ? + 4 = 9</span>
      </button>
      <button class="level" data-level="5" style="background:#e5383b">
        <span class="level-name" id="l5-name"></span>
        <span class="level-sub" id="l5-sub"></span>
      </button>
      <button class="level" data-level="6" style="background:#3fb36b">
        <span class="level-name" id="l6-name"></span>
        <span class="level-sub">🦘 15, 20, 25, ?</span>
      </button>
    </div>
    <button class="shelf-btn" id="open-garden">🌳 <span id="garden-label"></span> <b id="garden-count"></b></button>
  </main>

  <!-- Play -->
  <main id="play" class="play" hidden>
    <div class="status"><div id="hearts"></div><button class="round-btn" id="music"></button></div>
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <div class="lab">
      <p class="say" id="say"></p>
      <div class="xiruca" id="xiruca"></div>
      <div class="cauldron" id="cauldron">
        <svg viewBox="0 0 200 170" aria-hidden="true">
          <defs>
            <clipPath id="pot-clip"><path d="M30 60 q-8 70 30 92 h80 q38 -22 30 -92 z"/></clipPath>
          </defs>
          <path d="M45 152 l-12 16 M155 152 l12 16" stroke="#3a3a5c" stroke-width="8" stroke-linecap="round"/>
          <path d="M30 60 q-8 70 30 92 h80 q38 -22 30 -92 z" fill="#4b4b72" stroke="#3a3a5c" stroke-width="5"/>
          <g clip-path="url(#pot-clip)">
            <rect id="liquid" x="0" y="0" width="200" height="170" fill="#7ef0e6"/>
            <g id="pot-bubbles" fill="rgba(255,255,255,.7)"></g>
          </g>
          <rect x="22" y="50" width="156" height="16" rx="8" fill="#5e5e8c" stroke="#3a3a5c" stroke-width="5"/>
        </svg>
        <div class="splash" id="splash"></div>
        <div class="smoke" id="smoke" hidden><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="cat" id="cat"><span class="cat-say" id="cat-say" hidden></span></div>
    </div>
    <div class="answers" id="answers"></div>
  </main>

  <!-- New creature -->
  <div id="win" class="win" hidden>
    <div class="win-box">
      <p class="win-text" id="win-text"></p>
      <div id="win-stars"></div>
      <div class="creature" id="creature"></div>
      <p class="creature-name" id="creature-name"></p>
      <div class="win-buttons">
        <button class="big-btn" id="again" style="background:var(--pink)">🔁</button>
        <button class="big-btn" id="other" style="background:var(--orange)">🎚️</button>
        <button class="big-btn" id="to-garden" style="background:#3fb36b">🌳</button>
      </div>
    </div>
  </div>

  <!-- Creature garden -->
  <div id="garden" class="garden" hidden>
    <div class="garden-top">
      <p class="garden-title"><span id="garden-title"></span> <b id="garden-count2"></b></p>
      <button class="round-btn" id="close-garden">↩️</button>
    </div>
    <div class="garden-field" id="garden-field"></div>
    <p class="garden-name" id="garden-name"></p>
  </div>

  <script src="../../shared/app.js"></script>
  <script src="potions.js"></script>
</body>
</html>
