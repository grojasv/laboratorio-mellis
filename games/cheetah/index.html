<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd59e">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mellis">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Chita · Laboratorio Mellis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐆</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="cheetah.css">
</head>
<body class="savanna">
  <header class="topbar">
    <a class="home" href="../../index.html" aria-label="home">🏠</a>
    <h1 class="title" id="title"></h1>
    <div id="controls"></div>
  </header>

  <!-- Home: Chita + the three races -->
  <main id="home" class="screen" hidden>
    <div class="host-row">
      <div class="chita-host" id="home-chita"></div>
      <p class="say" id="home-say"></p>
      <div class="tools">
        <button class="round-btn" id="wardrobe-btn" aria-label="wardrobe">👗<span class="count" id="star-count"></span></button>
        <button class="round-btn" id="music"></button>
      </div>
    </div>
    <div class="modes" id="modes"></div>
  </main>

  <!-- The race -->
  <main id="race" class="race" hidden>
    <div class="hud">
      <div id="hearts"></div>
      <div class="gates" id="gates"></div>
      <div class="timer" id="timer">0:00</div>
    </div>
    <div class="question" id="question"></div>
    <div class="track" id="track">
      <canvas id="world"></canvas>
      <div class="runner" id="runner"><div class="runner-body" id="runner-body"></div></div>
      <div class="count-down" id="count-down" hidden></div>
    </div>
    <button class="dash" id="dash"></button>
  </main>

  <!-- Finish -->
  <div id="win" class="win" hidden>
    <div class="win-box">
      <p class="win-text" id="win-text"></p>
      <div id="win-stars"></div>
      <div class="chita-host big" id="win-chita"></div>
      <p class="win-time" id="win-time"></p>
      <p class="win-record" id="win-record" hidden></p>
      <p class="win-unlock" id="win-unlock" hidden></p>
      <div class="win-buttons">
        <button class="big-btn" id="again" style="background:var(--pink)">🔁</button>
        <button class="big-btn" id="to-home" style="background:var(--orange)">🏁</button>
        <button class="big-btn" id="to-wardrobe" style="background:var(--purple)">👗</button>
      </div>
    </div>
  </div>

  <!-- Wardrobe -->
  <div id="wardrobe" class="win" hidden>
    <div class="win-box wardrobe-box">
      <p class="ward-title"><span id="ward-title"></span> <b id="ward-stars"></b></p>
      <div class="chita-host" id="ward-chita"></div>
      <div id="ward-items"></div>
      <button class="big-btn stick-bottom" id="ward-close" style="background:var(--yellow)">👍</button>
    </div>
  </div>

  <script src="../../shared/app.js"></script>
  <script src="cheetah-art.js"></script>
  <script src="cheetah.js"></script>
</body>
</html>
