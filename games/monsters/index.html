<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d4f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mellis">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Monster Lab · Laboratorio Mellis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="monsters.css">
</head>
<body class="night">
  <header class="topbar">
    <a class="home" href="../../index.html" aria-label="home">🏠</a>
    <h1 class="title" id="title"></h1>
    <div id="controls"></div>
  </header>

  <!-- Level picker -->
  <main id="levels" class="levels">
    <div id="mascots-levels" class="levels-mascots"></div>
    <div class="levels-tools">
      <button class="round-btn" id="album-btn" aria-label="album">📒</button>
      <p class="levels-ask" id="ask"></p>
      <button class="round-btn" id="music-levels"></button>
    </div>
    <div class="level-buttons">
      <button class="level" data-level="1" style="background:var(--orange)">
        <span class="level-icons">⭐</span>
        <span class="level-name" id="l1-name"></span>
        <span class="level-sub">🎨 👀 🎩 👄</span>
      </button>
      <button class="level" data-level="2" style="background:var(--purple)">
        <span class="level-icons">⭐⭐</span>
        <span class="level-name" id="l2-name"></span>
        <span class="level-sub">+ 🐆 💪 🦇 📏</span>
      </button>
      <button class="level" data-level="3" style="background:#3fb36b">
        <span class="level-icons">⭐⭐⭐</span>
        <span class="level-name" id="l3-name"></span>
        <span class="level-sub">🚫 NO!</span>
      </button>
      <button class="level" data-level="4" style="background:#e5383b">
        <span class="level-icons">👂</span>
        <span class="level-name" id="l4-name"></span>
        <span class="level-sub">🔊 🇬🇧</span>
      </button>
    </div>
  </main>

  <!-- Build -->
  <main id="play" class="play" hidden>
    <div class="status">
      <div id="hearts"></div><div class="progress" id="progress"></div>
      <button class="round-btn" id="music"></button>
    </div>
    <div class="order">
      <div class="order-text">
        <p id="order-en" class="order-en"></p>
        <p id="order-hint" class="order-hint" hidden></p>
      </div>
      <div class="order-btns">
        <button class="round-btn" id="say" aria-label="listen">🔊</button>
        <button class="round-btn" id="hint" aria-label="hint">💡</button>
      </div>
    </div>
    <div class="stage">
      <div class="flask f1">🧪<i></i><i></i><i></i></div>
      <div class="flask f2">⚗️<i></i><i></i><i></i></div>
      <div class="monster" id="monster"></div>
      <div class="dr" id="dr"><div class="dr-say" id="dr-say" hidden></div><div class="dr-face" id="dr-face"></div></div>
      <button class="alive" id="alive">⚡ It's alive!</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </main>

  <div class="flash" id="flash" hidden></div>

  <!-- Monster party -->
  <div id="win" class="win" hidden>
    <div class="win-box">
      <div class="win-dr" id="win-dr"></div>
      <p class="win-text" id="win-text"></p>
      <div id="win-stars"></div>
      <div class="parade" id="parade"></div>
      <div class="win-buttons">
        <button class="big-btn" id="again" style="background:var(--orange)">🔁</button>
        <button class="big-btn" id="other" style="background:var(--purple)">🎚️</button>
        <a class="big-btn" href="../../index.html" style="background:var(--yellow)">🏠</a>
      </div>
    </div>
  </div>

  <!-- Album -->
  <div id="album" class="win" hidden>
    <div class="win-box album-box">
      <p class="win-text" id="album-title"></p>
      <div class="album-grid" id="album-grid"></div>
      <button class="big-btn stick-bottom" id="album-close" style="background:var(--yellow)">👍</button>
    </div>
  </div>

  <script src="../../shared/app.js"></script>
  <script src="monsters.js"></script>
</body>
</html>
