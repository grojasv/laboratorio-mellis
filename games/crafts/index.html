<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d8a6b">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mellis">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Taller Mellis · Laboratorio Mellis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="crafts.css">
</head>
<body class="workshop">
  <header class="topbar">
    <a class="home" href="../../index.html" aria-label="home">🏠</a>
    <h1 class="title" id="title"></h1>
    <div id="controls"></div>
  </header>

  <!-- Home: Tisoreta + the four crafts -->
  <main id="home" class="screen" hidden>
    <div class="host-row">
      <div class="tiso-host big"></div>
      <p class="tiso-say"></p>
      <div class="tools">
        <button class="round-btn" id="board-btn" aria-label="board">📌<span class="count" id="board-count"></span></button>
        <button class="round-btn" id="music"></button>
      </div>
    </div>
    <div id="crafts" class="crafts"></div>
  </main>

  <!-- Intro: the finished craft turning, and what you need -->
  <main id="intro" class="screen" hidden>
    <div class="bar-row">
      <button class="sq-btn" id="intro-back" aria-label="back">⬅️</button>
      <h2 class="intro-title" id="intro-title"></h2>
    </div>
    <div class="model" id="intro-model"></div>
    <div class="need-box">
      <h3 id="need-title"></h3>
      <ul class="need" id="need"></ul>
    </div>
    <div class="host-row small">
      <div class="tiso-host"></div>
      <p class="tiso-say"></p>
    </div>
    <button class="go-btn stick-bottom" id="go"></button>
  </main>

  <!-- Building: one step at a time -->
  <main id="build" class="screen" hidden>
    <div class="bar-row">
      <button class="sq-btn" id="step-back" aria-label="back">⬅️</button>
      <div class="step-no"><span id="step-num"></span><small id="step-of"></small></div>
      <div class="progress" id="progress"></div>
      <button class="sq-btn" id="step-say" aria-label="listen">🔊</button>
    </div>
    <div class="art" id="art"></div>
    <p class="caption" id="caption"></p>
    <div class="fet-row">
      <div class="tiso-host mini"></div>
      <p class="tiso-say"></p>
      <button class="go-btn fet" id="fet"></button>
    </div>
  </main>

  <!-- Finished -->
  <main id="done" class="screen" hidden>
    <div class="model big" id="done-model"></div>
    <p class="done-text" id="done-text"></p>
    <div class="host-row small">
      <div class="tiso-host"></div>
      <p class="tiso-say"></p>
    </div>
    <div class="done-btns">
      <button class="go-btn" id="photo-btn"></button>
      <button class="go-btn back" id="nophoto-btn"></button>
    </div>
    <input type="file" id="photo-in" accept="image/*" capture="environment" hidden>
  </main>

  <!-- The cork board -->
  <div id="board" class="win" hidden>
    <div class="win-box cork">
      <p class="board-title" id="board-title"></p>
      <div class="pins" id="pins"></div>
      <button class="big-btn board-ok" id="board-close" style="background:var(--yellow)">👍</button>
    </div>
  </div>
  <div id="zoom" class="win" hidden>
    <div class="win-box zoom-box">
      <div id="zoom-pic"></div>
      <p class="zoom-name" id="zoom-name"></p>
      <div class="win-buttons">
        <button class="big-btn" id="zoom-del" style="background:#fff">🗑️</button>
        <button class="big-btn" id="zoom-close" style="background:var(--yellow)">👍</button>
      </div>
    </div>
  </div>

  <script src="../../shared/app.js"></script>
  <script src="crafts-art.js"></script>
  <script src="crafts.js"></script>
</body>
</html>
