<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9f5">
  <title>Laboratorio Mellis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .hub { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
    .logo { font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700; margin: 0; line-height: 1; }
    .logo .l1 { color: var(--purple); display: block; font-size: 0.55em; letter-spacing: 0.06em; }
    .logo .l2 {
      background: linear-gradient(90deg, var(--pink), var(--orange), var(--teal));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .welcome { display: flex; align-items: flex-end; gap: 8px; margin: 8px 0 20px; }
    .welcome .mascots { width: min(46vw, 300px); flex: none; }
    .bubble-talk {
      position: relative;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 24px;
      padding: 14px 18px;
      font-size: clamp(1.1rem, 4.4vw, 1.6rem);
      font-weight: 500;
      box-shadow: var(--shadow);
      margin-bottom: 28%;
    }
    .bubble-talk::before {
      content: '';
      position: absolute;
      left: -16px; bottom: 18px;
      border: 10px solid transparent;
      border-right: 14px solid var(--ink);
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      gap: 20px;
    }
    .game {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 22px 16px 20px;
      border-radius: var(--radius);
      border: 4px solid var(--ink);
      box-shadow: 0 8px 0 var(--ink);
      color: #fff;
      text-decoration: none;
      text-align: center;
      transition: transform 0.12s, box-shadow 0.12s;
      overflow: hidden;
    }
    .game::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.35) 0 18%, transparent 19%);
      pointer-events: none;
    }
    .game:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
    .game .icon {
      font-size: 4.2rem;
      line-height: 1;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.15));
      animation: wiggle 3s ease-in-out infinite;
    }
    .game .name { font-size: 1.6rem; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .game .tag {
      font-size: 1.05rem; font-weight: 500;
      background: rgba(255,255,255,.9); color: var(--ink);
      border-radius: 999px; padding: 4px 14px;
    }
    .game.soon {
      background: repeating-linear-gradient(45deg, #fff 0 16px, #f3eaff 16px 32px);
      color: var(--purple);
      border-style: dashed;
      box-shadow: none;
    }
    .game.soon .name { text-shadow: none; font-size: 1.3rem; }
    .game.soon .icon { animation-duration: 1.4s; }
    @keyframes wiggle {
      0%, 80%, 100% { transform: rotate(0); }
      85% { transform: rotate(-10deg); }
      90% { transform: rotate(10deg); }
      95% { transform: rotate(-6deg); }
    }
    .tap { animation: tap 0.35s; }
    @keyframes tap { 40% { transform: scale(0.92) rotate(-2deg); } 70% { transform: scale(1.04) rotate(1deg); } }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="logo"><span class="l1">LABORATORIO</span><span class="l2">Mellis</span></h1>
    <div id="controls"></div>
  </header>

  <main class="hub">
    <section class="welcome">
      <div id="mascots"></div>
      <p class="bubble-talk" id="greeting"></p>
    </section>
    <section class="games" id="games"></section>
  </main>

  <script src="shared/app.js"></script>
  <script src="games.js"></script>
  <script>
    const M = window.Mellis;
    const GREETING = {
      ca: 'Hola! Som les Mellis. A què juguem avui?',
      es: '¡Hola! Somos las Mellis. ¿A qué jugamos hoy?',
      en: "Hi! We're the Mellis. What shall we play today?",
    };
    const SOON = { ca: 'Aviat, més experiments!', es: '¡Pronto, más experimentos!', en: 'More experiments soon!' };

    M.mountControls(document.getElementById('controls'));
    document.getElementById('mascots').innerHTML = M.mascotsSVG('wave');

    function render() {
      document.getElementById('greeting').textContent = M.t(GREETING);
      const cards = window.MELLIS_GAMES.map((g) => `
        <a class="game" href="${g.path}" style="background:${g.color}">
          <span class="icon">${g.icon}</span>
          <span class="name">${M.t(g.name)}</span>
          <span class="tag">${M.t(g.tagline)}</span>
        </a>`);
      cards.push(`
        <button class="game soon" type="button">
          <span class="icon">🔬</span>
          <span class="name">${M.t(SOON)}</span>
        </button>`);
      document.getElementById('games').innerHTML = cards.join('');
    }
    render();
    M.onLang(render);

    // Tap feedback: wiggle + sound, then go to the game
    document.getElementById('games').addEventListener('click', (e) => {
      const card = e.target.closest('.game');
      if (!card) return;
      e.preventDefault();
      card.classList.remove('tap'); void card.offsetWidth; card.classList.add('tap');
      if (card.classList.contains('soon')) { M.sounds.boing(); return; }
      M.sounds.pop();
      setTimeout(() => { location.href = card.getAttribute('href'); }, 300);
    });

    // Background bubbles
    const bubbles = document.querySelector('.bubbles');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      const size = 14 + Math.random() * 46;
      s.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
        `animation-duration:${10 + Math.random() * 14}s;animation-delay:${-Math.random() * 20}s`;
      bubbles.appendChild(s);
    }
  </script>
</body>
</html>
