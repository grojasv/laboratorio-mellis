<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mellis">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Laboratorio Mellis</title>
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .hub { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
    .logo { font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700; margin: 0; line-height: 1; }
    .logo .l1 { color: var(--purple); display: block; font-size: 0.55em; letter-spacing: 0.06em; }
    .logo .l2 {
      background: linear-gradient(90deg, var(--pink), var(--orange), var(--teal));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .welcome { display: flex; align-items: flex-end; gap: 8px; margin: 8px 0 20px; }
    .welcome .mascots { width: min(54vw, 320px); flex: none; }
    .bubble-talk {
      position: relative;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 24px;
      padding: 14px 18px;
      font-size: clamp(1.1rem, 4.4vw, 1.6rem);
      font-weight: 500;
      box-shadow: var(--shadow);
      margin-bottom: 28%;
    }
    .bubble-talk { cursor: pointer; transition: transform .12s; }
    .bubble-talk:active { transform: scale(.96); }
    .bubble-talk.talk { animation: talk .45s cubic-bezier(.3, 1.6, .6, 1); }
    @keyframes talk { 0% { transform: scale(.85) rotate(-3deg); } 100% { transform: none; } }
    .bubble-talk:not(.tapped)::after { /* hint: tap me */
      content: '👆';
      position: absolute; right: -10px; bottom: -18px;
      font-size: 1.6rem;
      animation: poke 1.2s ease-in-out infinite;
    }
    @keyframes poke { 50% { transform: translate(-4px, -6px) rotate(-10deg); } }
    .party .kid { animation: party-dance .5s ease-in-out 6 !important; }
    .party .kid-b { animation-delay: -.25s !important; }
    @keyframes party-dance { 25% { transform: translateY(-14px) rotate(-8deg); } 75% { transform: translateY(-14px) rotate(8deg); } }
    .bubble-talk::before { /* tail: a white diamond whose outer edges continue the border */
      content: '';
      position: absolute;
      left: -12px; bottom: 26px;
      width: 20px; height: 20px;
      background: #fff;
      border-left: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      border-bottom-left-radius: 4px;
      transform: rotate(45deg);
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      gap: 20px;
    }
    .game {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 22px 16px 20px;
      border-radius: var(--radius);
      border: 4px solid var(--ink);
      box-shadow: 0 8px 0 var(--ink);
      color: #fff;
      text-decoration: none;
      text-align: center;
      transition: transform 0.12s, box-shadow 0.12s;
      overflow: hidden;
    }
    .game::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.35) 0 18%, transparent 19%);
      pointer-events: none;
    }
    .game:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
    .game .icon {
      font-size: 4.2rem;
      line-height: 1;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.15));
      animation: wiggle 3s ease-in-out infinite;
    }
    .game .name { font-size: 1.6rem; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .game .tag {
      font-size: 1.05rem; font-weight: 500;
      background: rgba(255,255,255,.9); color: var(--ink);
      border-radius: 999px; padding: 4px 14px;
    }
    .section-title { margin: 22px 4px 10px; font-size: clamp(1.4rem, 6vw, 1.9rem); color: var(--purple); }
    @keyframes wiggle {
      0%, 80%, 100% { transform: rotate(0); }
      85% { transform: rotate(-10deg); }
      90% { transform: rotate(10deg); }
      95% { transform: rotate(-6deg); }
    }
    .tap { animation: tap 0.35s; }
    .news-banner {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; margin: 0 0 18px;
      background: linear-gradient(90deg, #ffd23f, #ff9f1c);
      border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink);
      padding: 12px; font-size: 1.35rem; font-weight: 700;
      animation: gift-bounce 1.6s ease-in-out infinite;
    }
    .news-banner:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
    @keyframes gift-bounce { 0%, 70%, 100% { transform: none; } 80% { transform: scale(1.04) rotate(-1.5deg); } 90% { transform: scale(1.04) rotate(1.5deg); } }
    .news-count {
      min-width: 34px; height: 34px; border-radius: 999px;
      background: #e03131; color: #fff; display: inline-grid; place-items: center;
      border: 3px solid var(--ink); font-size: 1.1rem;
    }
    .new-sticker {
      position: absolute; top: 12px; right: -34px; z-index: 2;
      background: #e03131; color: #fff;
      padding: 4px 40px; transform: rotate(35deg);
      font-weight: 700; font-size: 1rem; letter-spacing: .05em;
      border-top: 3px solid #fff; border-bottom: 3px solid #fff;
      box-shadow: 0 3px 0 rgba(0,0,0,.2);
    }
    .hub-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
    .hub-foot .install { margin: 0; }
    .families-link { color: var(--ink); text-decoration: none; font-size: 1rem; }
    .version { text-align: center; margin: 14px 0 0; font-size: 0.75rem; opacity: 0.45; }
    .news-pop { position: fixed; inset: 0; z-index: 40; background: rgba(58, 58, 92, .5); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .news-box {
      width: min(440px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto;
      background: var(--cream); border: 4px solid var(--ink); border-radius: 30px; box-shadow: 0 10px 0 var(--ink);
      padding: 16px; text-align: center;
      animation: news-in .4s cubic-bezier(.3, 1.6, .6, 1);
    }
    @keyframes news-in { from { transform: scale(.5); opacity: 0; } }
    .news-twins { width: 46%; margin: 0 auto; }
    .news-head { margin: 4px 0 12px; font-size: 1.8rem; font-weight: 700; color: var(--pink); }
    .news-list { display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .n-new {
      position: absolute; top: -10px; right: 10px;
      background: #e03131; color: #fff; border: 2px solid #fff; border-radius: 999px;
      padding: 0 8px; font-size: .8rem; font-weight: 700; box-shadow: 0 2px 0 rgba(0,0,0,.2);
    }
    .news-item {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 10px 12px;
    }
    .n-icon { font-size: 2.6rem; flex: none; }
    .n-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
    .n-text b { font-size: 1.25rem; }
    .n-text span { font-size: 1.1rem; }
    .n-text small { color: var(--purple); font-size: .9rem; margin-top: 2px; }
    .n-play {
      flex: none; text-decoration: none; color: #fff;
      background: var(--teal); border: 3px solid var(--ink); border-radius: 16px;
      box-shadow: 0 4px 0 var(--ink); padding: 8px 10px; font-weight: 700;
    }
    @media (max-width: 380px) {
      .news-item { flex-wrap: wrap; gap: 8px; }
      .n-icon { font-size: 2.1rem; }
      .n-text { flex-basis: calc(100% - 3.5rem); }
      .n-play { margin-left: auto; }
    }
    .n-none { font-size: 1.3rem; font-weight: 700; text-align: center; }
    .news-ok {
      margin-top: 14px;
      background: var(--yellow); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink);
      padding: 10px 28px; font-size: 1.4rem; font-weight: 700;
    }
    .news-ok:active, .n-play:active { transform: translateY(4px); box-shadow: none; }
    .install {
      display: block;
      margin: 28px auto 0;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: var(--shadow);
      padding: 10px 22px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .install:active { transform: translateY(4px); box-shadow: none; }
    @keyframes tap { 40% { transform: scale(0.92) rotate(-2deg); } 70% { transform: scale(1.04) rotate(1deg); } }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="logo"><span class="l1">LABORATORIO</span><span class="l2">Mellis</span></h1>
    <div id="controls"></div>
  </header>

  <main class="hub">
    <section class="welcome">
      <div id="mascots"></div>
      <p class="bubble-talk" id="greeting"></p>
    </section>
    <button class="news-banner" id="news-banner" hidden>🎁 <span id="news-banner-label"></span> <b class="news-count" id="news-count"></b></button>
    <h2 class="section-title" id="games-title"></h2>
    <section class="games" id="games"></section>
    <h2 class="section-title" id="read-title"></h2>
    <section class="games" id="read"></section>
    <h2 class="section-title" id="learn-title"></h2>
    <section class="games" id="learn"></section>
    <div class="hub-foot">
      <button class="install" id="news-all">🎁 <span id="news-all-label"></span></button>
      <button class="install" id="install" hidden>📲 <span id="install-label"></span></button>
      <a class="install families-link" href="families/index.html">👪 <span id="families-label"></span></a>
    </div>
    <p class="version" id="version"></p>
  </main>

  <!-- What's new (for the kids) -->
  <div class="news-pop" id="news-pop" hidden>
    <div class="news-box">
      <div class="news-twins" id="news-twins"></div>
      <p class="news-head" id="news-head"></p>
      <div class="news-list" id="news-list"></div>
      <button class="news-ok stick-bottom" id="news-ok">👍 <span id="news-ok-label"></span></button>
    </div>
  </div>

  <script src="shared/app.js"></script>
  <script src="games.js"></script>
  <script src="news.js"></script>
  <script>
    const M = window.Mellis;
    document.getElementById('version').textContent = 'v' + M.VERSION;
    const L = (ca, es, en) => ({ ca, es, en });
    // First line shown when the hub opens (one at random)
    const WELCOMES = [
      L('Hola! Som les Mellis. A què juguem avui?', '¡Hola! Somos las Mellis. ¿A qué jugamos hoy?', "Hi! We're the Mellis. What shall we play today?"),
      L('Benvingudes al laboratori! Compte, que les pocions fan bombolles! 🧪', '¡Bienvenidas al laboratorio! ¡Cuidado, que las pociones hacen burbujas! 🧪', 'Welcome to the lab! Careful, the potions are bubbling! 🧪'),
      L("Hola, científiques! Toca'ns i farem cares divertides! 👆", '¡Hola, científicas! ¡Tócanos y haremos caras divertidas! 👆', "Hello, scientists! Tap us and we'll make funny faces! 👆"),
    ];
    // Tapping the bubble: jokes, fun facts and silly challenges
    const FUNNY = [
      L('Saps què? Els pops tenen tres cors! 🐙', '¿Sabes qué? ¡Los pulpos tienen tres corazones! 🐙', 'Guess what? Octopuses have three hearts! 🐙'),
      L('Què fa una vaca amb els ulls tancats? Llet concentrada! 🐄', '¿Qué hace una vaca con los ojos cerrados? ¡Leche concentrada! 🐄', 'What do you call a sleeping dinosaur? A dino-snore! 🦕'),
      L('Hem perdut la lupa... ah no, la porto al cap! 🔍', 'Hemos perdido la lupa... ¡ah no, la llevo en la cabeza! 🔍', "We lost our magnifying glass... oh wait, it's on my head! 🔍"),
      L('Quants són 2 + 2? ... Peix! 🐟 Ah no, 4! Ja ja!', '¿Cuánto es 2 + 2? ... ¡Pez! 🐟 ¡Ah no, 4! ¡Ja ja!', "What's 2 + 2? ... Fish! 🐟 No wait, 4! Ha ha!"),
      L("Repte: digues «setze jutges d'un jutjat» molt de pressa! 👅", 'Reto: ¡di «tres tristes tigres» muy rápido! 👅', "Challenge: say 'red lorry, yellow lorry' really fast! 👅"),
      L('Els flamencs són rosa pel menjar que mengen! 🦩', '¡Los flamencos son rosas por la comida que comen! 🦩', 'Flamingos are pink because of the food they eat! 🦩'),
      L('Ups! Hem fet explotar una altra poció! 💥', '¡Uy! ¡Hemos hecho explotar otra poción! 💥', 'Oops! We blew up another potion! 💥'),
      L("Per què el llibre de mates està trist? Perquè té massa problemes! 📕", '¿Por qué está triste el libro de mates? ¡Porque tiene demasiados problemas! 📕', 'Why was the maths book sad? It had too many problems! 📕'),
      L('Una abella fa bzzz, un drac fa rots... i tu què fas? 🐝', 'Una abeja hace bzzz, un dragón eructa... ¿y tú qué haces? 🐝', 'A bee goes bzzz, a dragon burps... what do you do? 🐝'),
      L('Els cargols poden dormir molt i molt de temps. Quina mandra! 🐌', 'Los caracoles pueden dormir muchísimo tiempo. ¡Qué pereza! 🐌', 'Snails can sleep for a really, really long time. So lazy! 🐌'),
      L('Fem una cara de pop? Glu glu! 🐙', '¿Hacemos cara de pulpo? ¡Glu glu! 🐙', "Let's make an octopus face! Blub blub! 🐙"),
    ];
    // What a twin says after a tap, by the face she pulls
    const REACTIONS = {
      laugh: L('Ji ji ji! Pessigolles no! 😆', '¡Ji ji ji! ¡Cosquillas no! 😆', 'Hee hee! No tickling! 😆'),
      surprised: L('Uaaa! Quin ensurt! 😮', '¡Uaaa! ¡Qué susto! 😮', 'Whoa! You scared me! 😮'),
      tongue: L('Bleeeh! 😜', '¡Bleeeh! 😜', 'Bleeeh! 😜'),
      wink: L('Ep! Tu i jo fem un bon equip! 😉', '¡Eh! ¡Tú y yo hacemos un buen equipo! 😉', 'Hey! You and me make a great team! 😉'),
      love: L("T'estimem! 💖", '¡Te queremos! 💖', 'We love you! 💖'),
      dizzy: L("Uiii, m'he marejat! 💫", '¡Uyyy, me he mareado! 💫', "Whoa, I'm dizzy! 💫"),
      starry: L('Tinc una idea brillant! ✨', '¡Tengo una idea brillante! ✨', "I've got a brilliant idea! ✨"),
      sneeze: L('Atxím! Perdó, és la pols del laboratori! 🤧', '¡Achís! ¡Perdón, es el polvo del laboratorio! 🤧', 'Achoo! Sorry, lab dust! 🤧'),
    };
    const PARTY = L('Festa al laboratori! 🎉💃', '¡Fiesta en el laboratorio! 🎉💃', 'Lab party! 🎉💃');

    M.mountControls(document.getElementById('controls'));
    const mascots = document.getElementById('mascots');
    const bubble = document.getElementById('greeting');
    mascots.innerHTML = M.mascotsSVG('wave');
    let said = WELCOMES[Math.floor(Math.random() * WELCOMES.length)];

    function sayLine(line, speakIt) {
      said = line;
      bubble.textContent = M.t(line);
      bubble.classList.remove('talk'); void bubble.offsetWidth; bubble.classList.add('talk');
      if (speakIt) M.speak(M.t(line).replace(/\p{Extended_Pictographic}|\uFE0F/gu, ''), M.lang);
    }

    // Bubble: a new joke / fact each tap (no repeats until all are used)
    let deck = [];
    bubble.addEventListener('click', () => {
      if (!deck.length) deck = FUNNY.slice().sort(() => Math.random() - 0.5).filter((l) => l !== said);
      M.sounds.pop();
      bubble.classList.add('tapped');
      sayLine(deck.pop(), true);
    });

    // Twins: funny face + reaction; lots of quick taps start a party
    let taps = [];
    M.playfulMascots(mascots, (expr) => {
      const now = Date.now();
      taps = taps.filter((t) => now - t < 4000).concat(now);
      if (taps.length >= 7) { taps = []; party(); return; }
      sayLine(REACTIONS[expr], true);
    });
    function party() {
      mascots.innerHTML = M.mascotsSVG('cheer');
      mascots.classList.add('party');
      M.sounds.win();
      M.confetti();
      sayLine(PARTY, true);
      setTimeout(() => { mascots.classList.remove('party'); mascots.innerHTML = M.mascotsSVG('wave'); }, 3500);
    }

    // ---------- What's new: news since this device last looked ----------
    const NEWS = (window.MELLIS_NEWS || []).slice().sort((a, b) => a.id - b.id);
    const LAST_ID = NEWS.length ? NEWS[NEWS.length - 1].id : 0;
    const NT = {
      banner: L('Hi ha coses noves!', '¡Hay cosas nuevas!', "There's something new!"),
      all: L('Novetats', 'Novedades', "What's new"),
      head: L('Què hi ha de nou?', '¿Qué hay de nuevo?', "What's new?"),
      nothing: L('Ja ho has vist tot! 😄', '¡Ya lo has visto todo! 😄', "You've seen it all! 😄"),
      ok: L('Entesos!', '¡Entendido!', 'Got it!'),
      play: L('Juguem!', '¡A jugar!', "Let's play!"),
      sticker: L('NOU!', '¡NUEVO!', 'NEW!'),
      today: L('avui', 'hoy', 'today'),
      yesterday: L('ahir', 'ayer', 'yesterday'),
      daysAgo: L('fa {n} dies', 'hace {n} días', '{n} days ago'),
    };
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    };
    // First visit ever: nothing is "new" (everything is). A device that already has
    // progress from before the news existed gets the latest 3 items.
    if (store.get('mellis.news.seen') === null) {
      let returning = false;
      try { returning = Object.keys(localStorage).some((k) => k.startsWith('mellis.') && !k.startsWith('mellis.news') && k !== 'mellis.played'); } catch (e) { /* ignore */ }
      const start = returning ? Math.max(0, LAST_ID - 3) : LAST_ID;
      store.set('mellis.news.seen', String(start));
      store.set('mellis.news.base', String(start));
    }
    const seenId = () => +store.get('mellis.news.seen') || 0;
    const baseId = +store.get('mellis.news.base') || 0;
    const played = () => { try { return JSON.parse(store.get('mellis.played')) || []; } catch (e) { return []; } };
    const unread = () => NEWS.filter((n) => n.id > seenId());
    // "NOU!" sticker: a game announced after this device started, not played yet
    const isNewGame = (id) => NEWS.some((n) => n.type === 'game' && n.game === id && n.id > baseId) && !played().includes(id);

    function ago(date) {
      const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(date + 'T00:00:00').getTime()) / 86400000);
      if (days <= 0) return M.t(NT.today);
      if (days === 1) return M.t(NT.yesterday);
      return M.t(NT.daysAgo).replace('{n}', days);
    }

    let popItems = [];
    function openNews(items) {
      popItems = items;
      const pop = document.getElementById('news-pop');
      document.getElementById('news-twins').innerHTML = M.mascotsSVG('cheer');
      renderNews();
      pop.hidden = false;
      M.sounds.win();
      // the twins read the unseen news aloud (all of it if everything was seen), one after another
      const toRead = items.filter((n) => n.id > seenId());
      const say = (toRead.length ? toRead : items).slice().reverse().map((n) => `${M.t(n.title)} ${M.t(n.text)}`);
      (function next() {
        const line = say.shift();
        if (!line || pop.hidden) return;
        M.speak(line.replace(/\p{Extended_Pictographic}|\uFE0F/gu, ''), M.lang, { onend: () => setTimeout(next, 250) });
      })();
    }
    function renderNews() {
      const items = popItems.slice().reverse();
      document.getElementById('news-head').textContent = M.t(NT.head);
      document.getElementById('news-ok-label').textContent = M.t(NT.ok);
      document.getElementById('news-list').innerHTML = items.length ? items.map((n) => `
        <div class="news-item">
          <span class="n-icon">${n.icon}</span>
          ${n.id > seenId() ? `<span class="n-new">${M.t(NT.sticker)}</span>` : ''}
          <span class="n-text"><b>${M.t(n.title)}</b><span>${M.t(n.text)}</span><small>${ago(n.date)}</small></span>
          ${n.game ? `<a class="n-play" href="${n.path || `games/${n.game}/index.html`}">▶ ${M.t(NT.play)}</a>` : ''}
        </div>`).join('') : `<p class="n-none">${M.t(NT.nothing)}</p>`;
    }
    function closeNews() {
      document.getElementById('news-pop').hidden = true;
      if (window.speechSynthesis) speechSynthesis.cancel();
      store.set('mellis.news.seen', String(LAST_ID));
      renderNewsButtons();
    }
    function renderNewsButtons() {
      const n = unread().length;
      document.getElementById('news-banner').hidden = !n;
      document.getElementById('news-banner-label').textContent = M.t(NT.banner);
      document.getElementById('news-count').textContent = n;
      document.getElementById('news-all-label').textContent = M.t(NT.all);
    }
    document.getElementById('news-banner').addEventListener('click', () => { M.sounds.pop(); openNews(unread()); });
    // the bottom button shows the latest few, even if already seen
    // always available: the latest 5, with the unseen ones marked "NOU!"
    document.getElementById('news-all').addEventListener('click', () => {
      M.sounds.pop();
      const fresh = unread();
      openNews(fresh.length > 5 ? fresh : NEWS.slice(-5));
    });
    document.getElementById('news-ok').addEventListener('click', () => { M.sounds.pop(); closeNews(); });
    document.getElementById('news-list').addEventListener('click', (e) => {
      const a = e.target.closest('.n-play');
      if (!a) return;
      e.preventDefault();
      store.set('mellis.news.seen', String(LAST_ID));
      M.sounds.pop();
      setTimeout(() => { location.href = a.getAttribute('href'); }, 250);
    });

    function render() {
      bubble.textContent = M.t(said);
      renderNewsButtons();
      if (!document.getElementById('news-pop').hidden) renderNews();
      document.getElementById('install-label').textContent = M.t(INSTALL);
      document.getElementById('families-label').textContent = M.t(FAMILIES);
      const card = (g) => `
        <a class="game" href="${g.path}" style="background:${g.color}">
          ${isNewGame(g.id) ? `<span class="new-sticker">${M.t(NT.sticker)}</span>` : ''}
          <span class="icon">${g.icon}</span>
          <span class="name">${M.t(g.name)}</span>
          <span class="tag">${M.t(g.tagline)}</span>
        </a>`;
      document.getElementById('games').innerHTML = window.MELLIS_GAMES.filter((g) => !g.section).map(card).join('');
      document.getElementById('games-title').textContent = M.t(GAMES_T);
      document.getElementById('learn-title').textContent = M.t(LEARN_T);
      document.getElementById('read-title').textContent = M.t(READ_T);
      document.getElementById('read').innerHTML = window.MELLIS_GAMES.filter((g) => g.section === 'reading').map(card).join('');
      document.getElementById('learn').innerHTML = window.MELLIS_LEARN.map(card).join('');
    }
    const GAMES_T = L('🎮 Jocs', '🎮 Juegos', '🎮 Games');
    const READ_T = L('📚 Llegim', '📚 Leemos', "📚 Let's read");
    const LEARN_T = L('🎒 Aprenem', '🎒 Aprendemos', "🎒 Let's learn");
    const INSTALL = L("Instal·la el laboratori", 'Instala el laboratorio', 'Install the lab');
    const FAMILIES = L('Per a famílies i mestres', 'Para familias y docentes', 'For parents & teachers');
    render();
    M.onLang(render);
    M.onInstallable((can) => { document.getElementById('install').hidden = !can; });
    document.getElementById('install').addEventListener('click', () => { M.sounds.pop(); M.install(); });

    // Tap feedback: wiggle + sound, then go to the game
    const onCard = (e) => {
      const card = e.target.closest('.game');
      if (!card) return;
      e.preventDefault();
      card.classList.remove('tap'); void card.offsetWidth; card.classList.add('tap');
      M.sounds.pop();
      setTimeout(() => { location.href = card.getAttribute('href'); }, 300);
    };
    document.getElementById('games').addEventListener('click', onCard);
    document.getElementById('read').addEventListener('click', onCard);
    document.getElementById('learn').addEventListener('click', onCard);

    // Background bubbles
    const bubbles = document.querySelector('.bubbles');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      const size = 14 + Math.random() * 46;
      s.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
        `animation-duration:${10 + Math.random() * 14}s;animation-delay:${-Math.random() * 20}s`;
      bubbles.appendChild(s);
    }
  </script>
</body>
</html>
